<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyEat - お気に入り飲食店管理アプリ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.8;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 60px 20px;
            text-align: center;
        }
        .logo {
            font-size: 64px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 36px;
            color: #fff;
            margin-bottom: 16px;
        }
        .tagline {
            font-size: 18px;
            color: rgba(255,255,255,0.9);
            margin-bottom: 40px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .features {
            text-align: left;
            margin-bottom: 30px;
        }
        .feature {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }
        .feature-icon {
            font-size: 24px;
            margin-right: 16px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #eee;
        }
        .links a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }
        .links a:hover {
            text-decoration: underline;
        }
        .contact {
            margin-top: 30px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 8px;
        }
        .contact h3 {
            font-size: 16px;
            margin-bottom: 8px;
        }
        .contact a {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🍽️</div>
        <h1>MyEat</h1>
        <p class="tagline">お気に入りの飲食店を記録・共有しよう</p>
        
        <div class="card">
            <div class="features">
                <div class="feature">
                    <span class="feature-icon">❤️</span>
                    <span>お気に入りの店舗を写真付きで記録</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">📤</span>
                    <span>タイムラインで友達と共有</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">🔖</span>
                    <span>気になるお店を「行きたい」リストに保存</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">🗺️</span>
                    <span>Google マップ連携で簡単アクセス</span>
                </div>
            </div>

            <div class="contact">
                <h3>お問い合わせ</h3>
                <p><a href="mailto:eatwithmeapp2026@gmail.com">eatwithmeapp2026@gmail.com</a></p>
            </div>

            <div class="links">
                <a href="./terms.html">利用規約</a>
                <a href="./privacy.html">プライバシーポリシー</a>
            </div>
        </div>
    </div>
</body>
</html>
